[project]
name = "yahoo-finance-mcp"
version = "0.1.0"
description = "Remote MCP server for Yahoo Finance data with OAuth 2.1, deployable to Cloud Run"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
    "pyjwt>=2.15.1",
    "uvicorn>=0.54.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["live: tests that call the real Yahoo Finance API (run with -m live)"]
addopts = "-m 'not live'"
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*inplace.*"]
